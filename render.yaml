services:
  - type: web
    name: fitforge-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitforge-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: fitforge-db
    plan: free
